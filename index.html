<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CineClub checkout prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--bg:#0a0b0f;--card:#15171c;--line:#2a2d35;--tx:#fff;--mut:#a3a8b3;--blue:#0a5cff;--gold:#ffd400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Figtree,system-ui,sans-serif;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.app{min-height:100vh;background:radial-gradient(1200px 400px at 50% 0,#1b2233,transparent) var(--bg)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#000;font-weight:600;text-align:center;position:sticky;top:0;z-index:5}
.hd small{display:block;font-size:12px}.ic{background:none;border:0;font-size:22px;width:36px}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:10px;padding:18px 20px;border:1px solid transparent}
.mv{display:flex;gap:20px;margin-bottom:18px}
.poster{flex:none;width:118px;height:170px;border-radius:6px;background:linear-gradient(160deg,#e8573a,#2a49c9 55%,#0e1a52);display:flex;align-items:flex-end;justify-content:center;padding:8px;font-weight:700;font-size:13px;text-align:center}
h1{font-size:26px;margin:0 0 10px;line-height:1.2}h2{font-size:18px;margin:0 0 12px}
.tags{display:flex;gap:10px;align-items:center;color:var(--mut);margin-bottom:8px;font-size:13px}
.tag{border:1px solid var(--mut);padding:0 5px;color:#fff;font-size:12px}
.mut{color:var(--mut)}.row{display:flex;justify-content:space-between;margin:7px 0}
.bold{font-weight:700}
.note{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;background:#101217}
.tt{font-weight:600;display:flex;gap:8px;align-items:center}
.sq{width:14px;height:14px;border-radius:3px;display:inline-block}
.qty{display:flex;align-items:center;gap:14px}
.qb{width:24px;height:24px;border-radius:50%;border:1.5px solid #fff;background:none;line-height:1;font-size:16px;padding:0}
.qb:disabled{opacity:.3;cursor:default}
.btn{width:100%;background:var(--blue);border:0;border-radius:22px;padding:12px;font-weight:700;margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}
.link{color:#3d8bff;font-weight:600;background:none;border:0;padding:0}
.gold{color:var(--gold)}
.sel{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.pill{background:none;border:1px solid var(--blue);border-radius:4px;padding:5px 12px;font-size:12px;text-align:center;font-weight:600}
.pill small{display:block;font-size:10px;font-weight:400}.pill.on{background:var(--blue)}
.map{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0;overflow-x:auto}
.sr{display:flex;gap:10px}
.seat{width:30px;height:30px;border:0;border-radius:8px 8px 4px 4px;background:#1a74ff;font-size:10px;font-weight:700;padding:0}
.seat.x{background:#2b2e36;color:#555;cursor:default}.seat.pk{background:#fff;color:#000;box-shadow:0 0 0 2px var(--gold)}
.seat.w{background:none;font-size:18px;cursor:default}
.spc{width:30px}
.club{border:2px solid var(--gold);background:linear-gradient(135deg,#241f06,#15171c 60%)}
.club ul{margin:8px 0 10px;padding-left:18px;line-height:1.6}
.logo{font-weight:800;letter-spacing:.5px;font-size:20px}.logo b{color:var(--gold)}
.cta{background:var(--gold);color:#111;border:0;border-radius:22px;padding:12px;font-weight:700;width:100%}
.hl{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(255,212,0,.12)}
.sv{background:rgba(255,212,0,.14);color:var(--gold);border-radius:8px;padding:8px 12px;font-weight:700;margin:10px 0;text-align:center}
.st{text-decoration:line-through;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.md{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:460px;width:100%;padding:24px}
.md p{color:var(--mut);line-height:1.5}
.two{display:flex;gap:10px}.two button{flex:1;border-radius:22px;padding:11px;font-weight:700}
.ghost{background:none;border:1px solid var(--mut)}
.spin{width:46px;height:46px;border:4px solid #333;border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 18px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.cf{max-width:640px;margin:0 auto;padding:30px 20px 60px}
.cf h1{font-size:34px}
.snk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.snk{grid-template-columns:repeat(2,1fr)}}
.sn{background:#1c1f26;border-radius:6px;padding:8px;font-size:12px}
.sn i{display:block;height:60px;border-radius:4px;background:#e9e9ee;margin-bottom:8px}
.badge{display:inline-flex;gap:6px;align-items:center;background:var(--gold);color:#111;font-weight:800;padding:4px 12px;border-radius:14px;font-size:12px}
.cc{border:2px solid var(--gold);background:linear-gradient(135deg,#2c2507,#12141a 65%);border-radius:14px;padding:22px;margin-bottom:22px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect}=React;
const html=htm.bind(React.createElement);
const m=n=>'$'+n.toFixed(2);
const TAX=0.13,FEE=1.5,FEE_CLUB=0,MEMBER=10.99;
const TYPES=[
 {g:'D-BOX Tickets',c:'#ff7a1a',items:[['dg','General (14-64)',26],['ds','Senior (65+)',24],['dc','Child (3-12)',20]]},
 {g:'Standard Tickets',c:'#1a74ff',items:[['sg','General (14-64)',18],['ss','Senior (65+)',16],['sc','Child (3-12)',12]]}];
const PRICE={};TYPES.forEach(t=>t.items.forEach(i=>PRICE[i[0]]=i[2]));
const ROWS=[
 ['A4','A5','A6','A7','A8','A9','A10','A11','A12','A13'],
 ['x','x','B7','B8','B9','x','B11','B12','x','x'],
 ['x','x','C6','C7','x','x','x','x','C13','C14'],
 ['w','D3','D4','D5','D6','D7','D8','D9','w'],
 ['E2','E3','E4','E5','E6','E7','E8','E9','E10','E11','E12']];
const FREE=[];
function money(q){
 const list=[];Object.keys(q).forEach(k=>{for(let i=0;i<q[k];i++)list.push(PRICE[k])});
 const n=list.length,sub=list.reduce((a,b)=>a+b,0);
 const tax=(sub+(n?FEE:0))*TAX,total=sub+(n?FEE:0)+tax;
 const free=n?Math.max(...list):0,sub2=sub-free;
 const tax2=(sub2+MEMBER)*TAX,total2=sub2+MEMBER+tax2;
 return{n,sub,fee:n?FEE:0,tax,total,free,tax2,total2,saved:total-total2};
}

function Header({title,sub,onBack,onClose}){
 return html`<div className="hd"><button className="ic" onClick=${onBack} style=${{visibility:onBack?'visible':'hidden'}} aria-label="Back">‹</button>
 <div>${title}${sub&&html`<small>${sub}</small>`}</div><button className="ic" onClick=${onClose} aria-label="Close">✕</button></div>`;
}
function Movie({title}){
 return html`<div className="mv"><div className="poster">QUANTUMANIA</div><div>
 <h1>${title||'Ant-Man and the Wasp: Quantumania'}</h1>
 <div className="tags"><span className="tag">PG</span><span>French (Dubbed)</span><b>3D</b><span>ATMOS</span></div>
 <div className="mut" style=${{margin:'8px 0'}}>Friday, Apr 12 - 3:00 PM</div>
 <div className="bold">Scotiabank Theatre</div><div className="mut">259 Richmond St W, Toronto, ON</div></div></div>`;
}

function Tickets({q,setQ,next,back,clock}){
 const t=money(q);
 const ch=(k,d)=>setQ({...q,[k]:Math.max(0,Math.min(8,q[k]+d))});
 return html`<div><${Header} title="Ticket Selection" sub=${clock} onBack=${back} onClose=${back}/>
 <div className="wrap"><div>
  <${Movie}/>
  <div className="note">Online Booking Fee of up to $1.50 may apply. <b>Fee does not apply for in-theatre purchases.</b> ⓘ</div>
  ${TYPES.map(g=>html`<div className="card" style=${{marginBottom:16}} key=${g.g}>
   <h2 className="tt"><span className="sq" style=${{background:g.c}}></span>${g.g} ⓘ</h2>
   ${g.items.map(([k,l])=>html`<div className="row" key=${k} style=${{margin:'16px 0'}}><span className="bold">${l}</span>
    <span className="qty"><button className="qb" disabled=${!q[k]} onClick=${()=>ch(k,-1)}>−</button>${q[k]}<button className="qb" onClick=${()=>ch(k,1)}>+</button></span></div>`)}
  </div>`)}
 </div><div>
  <div className="card"><h2>Order Summary</h2>
   <div className="row"><span className="mut">Tickets (includes online booking fee):</span><span>${t.n?m(t.sub+t.fee):'$0.00'}</span></div>
   <div className="row"><span className="mut">Tax:</span><span>${m(t.tax)}</span></div>
   <button className="btn" disabled=${!t.n} onClick=${next}>Proceed ${m(t.total)}</button></div>
  <div className="card" style=${{marginTop:16}}><button className="link">＋ Add certificate or promo code</button></div>
 </div></div></div>`;
}

function Seats({seats,setSeats,n,next,back}){
 const [time,setTime]=useState(0);
 const tog=id=>{
  if(seats.includes(id))setSeats(seats.filter(s=>s!==id));
  else if(seats.length<n)setSeats([...seats,id]);
  else setSeats([...seats.slice(1),id]);
 };
 const times=['3:30 PM','4:30 PM','5:30 PM','7:45 PM','8:30 PM','9:30 PM'];
 return html`<div><${Header} title="Seat Preview" onBack=${back} onClose=${back}/>
 <div className="wrap" style=${{gridTemplateColumns:'1fr',maxWidth:780}}><div>
  <div className="mv"><div className="poster">QUANTUMANIA</div><div>
   <h1>Ant-Man and the Wasp: long movie title here</h1>
   <div className="tags"><b>ULTRAAVX</b><b>Dolby Atmos</b></div>
   <div className="tags"><span className="tag">PG</span><span>English • French Subtitles</span></div>
   <div className="mut" style=${{margin:'8px 0'}}>Wed Sep 26 • 7:00 PM</div>
   <div className="mut">Cineplex Cinemas Yonge-Eglinton and VIP<br/>259 Richmond St W, Toronto, ON</div></div></div>
  <div className="sel">${times.map((x,i)=>html`<button key=${x} className=${'pill'+(i===time?' on':'')} onClick=${()=>setTime(i)}>${x}<small>Fri, Apr 12</small></button>`)}</div>
  <div className="map">${ROWS.map((r,ri)=>html`<div className="sr" key=${ri}>${r.map((s,i)=>s==='x'?html`<button key=${i} className="seat x" disabled aria-label="Unavailable"></button>`:s==='w'?html`<span key=${i} className="seat w">♿</span>`:html`<button key=${s} className=${'seat'+(seats.includes(s)?' pk':'')} onClick=${()=>tog(s)}>${s}</button>`)}</div>`)}</div>
  <div style=${{textAlign:'center'}} className="mut">Selected ${seats.length} of ${n}: ${seats.join(', ')||'none'}</div>
  <button className="btn" style=${{maxWidth:360,display:'block',margin:'16px auto'}} disabled=${seats.length!==n} onClick=${next}>Continue to checkout</button>
 </div></div></div>`;
}

function Checkout({q,seats,member,setModal,pay,back,clock}){
 const t=money(q);
 const lines=[];Object.keys(q).forEach(k=>{if(q[k])lines.push(q[k]+' x '+(k[1]==='g'?'General (14-64)':k[1]==='s'?'Senior (65+)':'Child (3-12)'))});
 return html`<div><${Header} title="Checkout" sub=${clock} onBack=${back} onClose=${back}/>
 <div className="wrap"><div>
  <${Movie}/>
  <div className="card row" style=${{marginBottom:16,padding:'22px 20px'}}><span><b style=${{fontStyle:'italic',fontSize:18}}>VISA</b> &nbsp; <b>Ending in 2892</b></span><span>›</span></div>
  <div className="card row" style=${{padding:'22px 20px'}}><b>Add gift card</b><span>›</span></div>
 </div><div>
  ${!member&&html`<div className="card club" style=${{marginBottom:16}}>
   <div className="logo">CINE<b>CLUB</b></div>
   <div className="sv">Save ${m(t.saved)} on this order by upgrading to CineClub</div>
   <div className="bold">$10.99/mo.</div>
   <ul><li>One free ticket*</li><li>Additional discounted tickets</li><li>No online booking fees</li><li>20% off food & beverages</li></ul>
   <button className="cta" onClick=${()=>setModal(true)}>Enrol me to CineClub and book tickets for ${m(t.total2)}</button>
   <div className="mut" style=${{fontSize:11,marginTop:8}}>*Applies to the highest-priced ticket on this order. Monthly membership billed today and renews monthly. Cancel anytime.</div>
  </div>`}
  <div className=${'card'+(member?' hl':'')}>
   <h2 className="row" style=${{marginBottom:6}}>Order Summary ${member&&html`<span className="badge">Saving with CineClub</span>`}</h2>
   ${!member?html`<div>
    <div className="row"><span className="mut">Tickets:</span><span>${m(t.sub)}</span></div>
    <div className="row"><span className="mut">Online Booking Fee ⓘ</span><span>${m(t.fee)}</span></div>
    <div className="row"><span className="mut">Tax:</span><span>${m(t.tax)}</span></div>
    <button className="btn" onClick=${pay}>Pay ${m(t.total)}</button></div>`
   :html`<div>
    <div className="row"><span className="mut">Tickets:</span><span className="st">${m(t.sub)}</span></div>
    <div className="row gold"><span>CineClub free ticket*</span><span>−${m(t.free)}</span></div>
    <div className="row"><span className="mut">Online Booking Fee</span><span><span className="st">${m(t.fee)}</span> <b className="gold">${m(FEE_CLUB)}</b></span></div>
    <div className="row"><span className="mut">CineClub membership (monthly)</span><span>${m(MEMBER)}</span></div>
    <div className="row"><span className="mut">Tax:</span><span>${m(t.tax2)}</span></div>
    <div className="sv">You're saving ${m(t.saved)} with CineClub</div>
    <button className="cta" onClick=${pay}>Pay ${m(t.total2)}</button></div>`}
   <div className="mut" style=${{fontSize:11,marginTop:12}}>By continuing past this page, you agree to our <b style=${{color:'#fff'}}>Terms & Conditions</b></div>
  </div>
  <div className="card" style=${{marginTop:16}}><div className="row"><h2 style=${{margin:0}}>Your Tickets (${t.n})</h2><button className="link" onClick=${back}>Edit</button></div>
   ${lines.map(l=>html`<div key=${l}>${l}</div>`)}<div style=${{marginTop:6}}>Seat Numbers: ${seats.join(', ')}</div></div>
 </div></div></div>`;
}

function Confirm({member,q,done}){
 const t=money(q);
 return html`<div><${Header} title="Confirmation" onClose=${done}/>
 <div className="cf">
  ${member?html`<div className="cc"><div className="logo">CINE<b>CLUB</b></div>
    <div style=${{margin:'10px 0'}}><span className="badge">★ CineClub member</span></div>
    <h1 style=${{margin:'0 0 8px'}}>Your escape is booked! And welcome to CineClub</h1>
    <div className="gold bold">You saved ${m(t.saved)} on this order with CineClub.</div>
    <div className="mut" style=${{marginTop:8}}>Your free ticket, no booking fees and 20% off food & drinks are active now.</div></div>`
  :html`<h1>Your escape is booked!</h1>`}
  <div className="mut" style=${{marginBottom:16}}>You earned <b style=${{color:'#fff'}}>2400</b> Scene+ pts · A confirmation email will be sent to <b style=${{color:'#fff'}}>brian@email.com</b></div>
  <${Movie}/>
  <button className="btn" style=${{maxWidth:200,marginBottom:24}}>View my tickets</button>
  <div className="row"><h2>Grab your movie snacks</h2><button className="link">View full menu ›</button></div>
  <div className="gold" style=${{marginBottom:10,fontSize:12}}>CineClub Members save 20% on Food & Drinks</div>
  <div className="snk">${[['Combo 1'],['Combo 2'],['Large Drink'],['Large Popcorn']].map(([n])=>html`<div className="sn" key=${n}><i></i><b>${n}</b><div><span className="gold">$15.00</span> <span className="st">$19.57</span></div></div>`)}</div>
  <div className=${'card row'+(member?' hl':'')} style=${{marginTop:24}}><span>Get the Cineplex app<br/><span className="mut">Manage your movie tickets with ease on the app</span></span><span className="mut">App Store · Google Play</span></div>
 </div></div>`;
}

function App(){
 const [scr,setScr]=useState('tickets');
 const [q,setQ]=useState({dg:0,ds:0,dc:0,sg:1,ss:0,sc:0});
 const [seats,setSeats]=useState([]);
 const [member,setMember]=useState(false);
 const [modal,setModal]=useState(false);
 const [busy,setBusy]=useState(false);
 const [secs,setSecs]=useState(299);
 useEffect(()=>{const i=setInterval(()=>setSecs(s=>Math.max(0,s-1)),1000);return()=>clearInterval(i)},[]);
 const clock=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
 const n=money(q).n;
 const reset=()=>{setScr('tickets');setMember(false);setSeats([]);setSecs(299)};
 const toSeats=()=>{const e=ROWS[4].filter(s=>s!=='x');setSeats(e.slice(2,2+n));setScr('seats')};
 const confirmEnrol=()=>{setModal(false);setBusy(true);setTimeout(()=>{setBusy(false);setMember(true)},2800)};
 return html`<div className="app">
  ${scr==='tickets'&&html`<${Tickets} q=${q} setQ=${setQ} next=${toSeats} back=${reset} clock=${clock}/>`}
  ${scr==='seats'&&html`<${Seats} seats=${seats} setSeats=${setSeats} n=${n} next=${()=>setScr('checkout')} back=${()=>setScr('tickets')}/>`}
  ${scr==='checkout'&&html`<${Checkout} q=${q} seats=${seats} member=${member} setModal=${setModal} pay=${()=>setScr('confirm')} back=${()=>{setMember(false);setScr('seats')}} clock=${clock}/>`}
  ${scr==='confirm'&&html`<${Confirm} member=${member} q=${q} done=${reset}/>`}
  ${modal&&html`<div className="ov"><div className="md" role="dialog" aria-modal="true">
   <div className="logo">CINE<b>CLUB</b></div><h2 style=${{marginTop:10}}>Terms and conditions</h2>
   <p>CineClub is a $10.99/mo. membership, charged today and every month until you cancel. Includes one free ticket per month*, discounted additional tickets, no online booking fees and 20% off food & beverages. Your current order will be revised to apply these benefits. Unused monthly tickets never expire.</p>
   <div className="two"><button className="ghost" onClick=${()=>setModal(false)}>Cancel</button><button style=${{background:'var(--gold)',color:'#111',border:0}} onClick=${confirmEnrol}>Confirm</button></div></div></div>`}
  ${busy&&html`<div className="ov" style=${{background:'rgba(0,0,0,.88)',textAlign:'center'}}><div><div className="spin"></div><div className="bold">Working on revising your order and applying CineClub benefits</div></div></div>`}
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
